<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Okooo 预测 Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --surface-2: #eef2f6;
      --ink: #17202a;
      --muted: #667085;
      --line: #d8dee8;
      --blue: #2663eb;
      --green: #0f8f68;
      --red: #c33b4a;
      --amber: #b56a00;
      --violet: #7a4fd6;
      --shadow: 0 10px 30px rgba(23, 32, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }

    .brand {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .meta-line {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 10px 22px 0;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }

    .tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 11px 14px;
      border-bottom: 3px solid transparent;
      min-height: 42px;
    }

    .tab.active {
      color: var(--ink);
      border-color: var(--blue);
      font-weight: 700;
    }

    .btn {
      border: 1px solid var(--line);
      border-radius: 6px;
      min-height: 36px;
      padding: 8px 12px;
      color: var(--ink);
      background: var(--surface);
    }

    .btn.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
      font-weight: 700;
    }

    .btn.ghost {
      background: transparent;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: progress;
    }

    .content {
      padding: 18px 22px 24px;
    }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      min-width: 0;
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 22px;
      line-height: 1.1;
      font-weight: 800;
    }

    .trend-grid {
      display: grid;
      grid-template-columns: minmax(290px, 370px) minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
    }

    .panel-title {
      font-weight: 800;
      line-height: 1.2;
    }

    .panel-body {
      padding: 14px;
    }

    .search-row {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 8px;
    }

    .search-input {
      width: 100%;
      min-height: 38px;
      border-radius: 6px;
      border: 1px solid var(--line);
      padding: 8px 10px;
      background: #fff;
      color: var(--ink);
    }

    .match-list {
      max-height: calc(100vh - 265px);
      overflow: auto;
    }

    .match-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      width: 100%;
      min-height: 76px;
      padding: 11px 12px;
      border: 0;
      border-bottom: 1px solid var(--line);
      text-align: left;
      background: transparent;
      color: var(--ink);
    }

    .match-row:hover,
    .match-row.active {
      background: #eef5ff;
    }

    .match-name {
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .match-sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .score-pill {
      align-self: start;
      min-width: 72px;
      padding: 5px 8px;
      border-radius: 6px;
      font-weight: 800;
      text-align: center;
      color: #fff;
      background: var(--muted);
    }

    .score-pill.upper,
    .badge.hit,
    .badge.up {
      background: var(--green);
    }

    .score-pill.lower,
    .badge.down,
    .badge.miss {
      background: var(--red);
    }

    .score-pill.wait,
    .badge.na,
    .badge.push {
      background: var(--amber);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      padding: 4px 8px;
      border-radius: 6px;
      color: #fff;
      background: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge.soft {
      color: var(--ink);
      background: var(--surface-2);
      border: 1px solid var(--line);
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .detail-title {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .match-heading {
      font-size: 24px;
      line-height: 1.2;
      margin: 0 0 5px;
      letter-spacing: 0;
    }

    .metric-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .metric-tab {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 6px;
      padding: 6px 9px;
      color: var(--muted);
      min-height: 32px;
    }

    .metric-tab.active {
      color: #fff;
      border-color: var(--violet);
      background: var(--violet);
      font-weight: 800;
    }

    .chart-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fcfdff;
      min-height: 260px;
    }

    .chart-box svg {
      width: 100%;
      height: 260px;
      display: block;
    }

    .split {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(260px, 0.9fr);
      gap: 14px;
      margin-top: 14px;
    }

    .table-wrap {
      width: 100%;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 780px;
      background: #fff;
    }

    th,
    td {
      padding: 10px 11px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      background: #f8fafc;
      font-weight: 800;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .signals {
      display: grid;
      gap: 8px;
    }

    .signal {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px;
      background: #fff;
    }

    .signal-main {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-weight: 800;
    }

    .signal-summary {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .predict-box {
      margin-top: 14px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    .predict-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      color: var(--muted);
      font-size: 13px;
    }

    .predict-result {
      margin-top: 12px;
      display: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfcfe;
    }

    .predict-result.visible {
      display: block;
    }

    .notice {
      margin-top: 9px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .validate-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .empty {
      padding: 32px 14px;
      color: var(--muted);
      text-align: center;
    }

    .hidden {
      display: none;
    }

    .positive {
      color: var(--green);
      font-weight: 800;
    }

    .negative {
      color: var(--red);
      font-weight: 800;
    }

    .muted {
      color: var(--muted);
    }

    @media (max-width: 1080px) {
      .summary-strip {
        grid-template-columns: repeat(3, minmax(120px, 1fr));
      }

      .trend-grid,
      .split {
        grid-template-columns: 1fr;
      }

      .match-list {
        max-height: 360px;
      }
    }

    @media (max-width: 720px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
        padding: 14px;
      }

      .toolbar {
        justify-content: flex-start;
        width: 100%;
      }

      .tabs,
      .content {
        padding-left: 14px;
        padding-right: 14px;
      }

      .summary-strip,
      .detail-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .detail-title {
        display: block;
      }

      .match-heading {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <h1>Okooo 预测 Dashboard</h1>
        <div class="meta-line" id="metaLine">加载中</div>
      </div>
      <div class="toolbar">
        <button class="btn" id="reloadBtn" type="button">刷新数据</button>
      </div>
    </header>

    <nav class="tabs" aria-label="Dashboard views">
      <button class="tab active" type="button" data-tab="trend">预测趋势</button>
      <button class="tab" type="button" data-tab="validate">Validate 记录</button>
    </nav>

    <section class="content" id="trendView">
      <div class="summary-strip" id="snapshotStats"></div>
      <div class="trend-grid">
        <aside class="panel">
          <div class="panel-head">
            <div class="panel-title">快照比赛</div>
            <span class="badge soft" id="matchCount">0 场</span>
          </div>
          <div class="search-row">
            <div class="filter-group" id="snapshotStatusFilters">
              <button class="metric-tab active" type="button" data-status-filter="all">全部</button>
              <button class="metric-tab" type="button" data-status-filter="finished">已完赛</button>
              <button class="metric-tab" type="button" data-status-filter="unfinished">未完赛</button>
            </div>
            <input class="search-input" id="searchInput" placeholder="搜索球队 / event_id" autocomplete="off">
          </div>
          <div class="match-list" id="matchList"></div>
        </aside>

        <section class="panel">
          <div class="panel-body" id="detailBody"></div>
        </section>
      </div>
    </section>

    <section class="content hidden" id="validateView">
      <div class="summary-strip" id="validateStats"></div>
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">Validate 复盘记录 · 末两条合格赛前快照中位数</div>
          <span class="badge soft" id="validateCount">0 条</span>
        </div>
        <div class="panel-body">
          <div class="validate-tools">
            <div class="filter-group">
              <button class="metric-tab active" type="button" data-filter="all">全部</button>
              <button class="metric-tab" type="button" data-filter="hit">全赢 / 半赢</button>
              <button class="metric-tab" type="button" data-filter="miss">半输 / 全输</button>
              <button class="metric-tab" type="button" data-filter="push">走水</button>
              <button class="metric-tab" type="button" data-filter="missing">排除 / 不足两条</button>
            </div>
            <span class="muted" id="scoresPath"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>event_id</th>
                  <th>末两条时点</th>
                  <th>对阵</th>
                  <th>盘口</th>
                  <th>推荐</th>
                  <th>模型</th>
                  <th>末两条中位数</th>
                  <th>比分</th>
                  <th>结果</th>
                  <th>收益</th>
                  <th>快照时间</th>
                </tr>
              </thead>
              <tbody id="validateRows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const state = {
      data: null,
      selectedId: null,
      metric: "score",
      tab: "trend",
      snapshotStatusFilter: "all",
      validateFilter: "all",
      predictionById: new Map(),
      loadingPredict: false
    };

    const metrics = [
      ["score", "score"],
      ["heat_edge", "必发热度"],
      ["amount_edge", "成交倾斜"],
      ["payout_edge", "盈亏压力"],
      ["upper_water", "上盘水位"],
      ["line_depth", "盘口深度"],
      ["euro_edge", "欧赔确认"]
    ];

    const el = (id) => document.getElementById(id);

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[ch]);
    }

    function fmt(value, digits = 3) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "-";
      return n > 0 ? `+${n.toFixed(digits)}` : n.toFixed(digits);
    }

    function pct(value) {
      if (value === null || value === undefined) return "-";
      return `${Math.round(Number(value) * 100)}%`;
    }

    function shortTime(iso) {
      if (!iso) return "-";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso.slice(0, 16);
      return new Intl.DateTimeFormat("zh-CN", {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(d);
    }

    function timeValue(iso) {
      const d = new Date(iso || "");
      return Number.isNaN(d.getTime()) ? Number.NEGATIVE_INFINITY : d.getTime();
    }

    function classForSide(side) {
      if (side === "上盘") return "upper";
      if (side === "下盘") return "lower";
      return "wait";
    }

    function classForOutcome(outcome) {
      if (outcome === "hit" || outcome === "full_win" || outcome === "half_win") return "hit";
      if (outcome === "miss" || outcome === "full_loss" || outcome === "half_loss") return "miss";
      if (outcome === "push") return "push";
      if (outcome === "na") return "na";
      return "soft";
    }

    function outcomeText(outcome) {
      return {
        hit: "命中",
        miss: "未中",
        full_win: "全赢",
        half_win: "半赢",
        half_loss: "半输",
        full_loss: "全输",
        push: "走水",
        na: "观望",
        excluded: "排除",
        missing: "缺快照",
        error: "错误"
      }[outcome] || "-";
    }

    function recommendationTag(item) {
      const side = item?.purchase_side || item?.recommendation || "-";
      return item?.strength ? `${side} · ${item.strength}` : side;
    }

    function recommendationText(item) {
      const team = item?.purchase_team ? ` · ${item.purchase_team}` : "";
      return `${recommendationTag(item)}${team}`;
    }

    function selectedEvent() {
      const rows = filteredSnapshots();
      if (!rows.length) return null;
      return rows.find((item) => item.event_id === state.selectedId) || rows[0];
    }

    function statHtml(label, value, extra = "") {
      return `
        <div class="stat">
          <div class="stat-label">${escapeHtml(label)}</div>
          <div class="stat-value">${escapeHtml(value)}</div>
          ${extra ? `<div class="notice">${escapeHtml(extra)}</div>` : ""}
        </div>
      `;
    }

    function renderReplayNote(item) {
      if (!item.validation || item.validation.score === undefined || item.validation.score === null) return "";
      const team = item.validation.purchase_team ? ` · ${item.validation.purchase_team}` : "";
      return ` Validate：${item.validation.purchase_side || item.validation.recommendation || "-"}${team}，score ${fmt(item.validation.score, 3)}。`;
    }

    async function loadDashboard(keepSelection = false) {
      el("reloadBtn").disabled = true;
      el("metaLine").textContent = "加载中";
      try {
        const res = await fetch("/api/dashboard", { cache: "no-store" });
        const payload = await res.json();
        if (!payload.ok) throw new Error(payload.error || "load failed");
        const previousId = state.selectedId;
        state.data = payload.data;
        if (!keepSelection || !state.data.snapshots.some((item) => item.event_id === previousId)) {
          state.selectedId = state.data.snapshots[0]?.event_id ?? null;
        }
        el("metaLine").textContent = `${state.data.snapshot_root} · ${shortTime(state.data.generated_at)}`;
        renderAll();
      } catch (err) {
        el("metaLine").textContent = `加载失败：${err.message}`;
      } finally {
        el("reloadBtn").disabled = false;
      }
    }

    function renderAll() {
      renderSnapshotStats();
      renderMatchList();
      renderDetail();
      renderValidateStats();
      renderValidateRows();
    }

    function renderSnapshotStats() {
      const snapshots = state.data?.snapshots || [];
      const latestSnapshot = snapshots.reduce(
        (best, item) => (!best || timeValue(item.last_fetched_at) > timeValue(best.last_fetched_at) ? item : best),
        null
      );
      const latestMatch = snapshots[0];
      const directionCount = snapshots.filter((item) => item.last_result.purchase_side !== "观望").length;
      const avgCompleteness = snapshots.length
        ? Math.round(snapshots.reduce((sum, item) => sum + Number(item.last_result.completeness || 0), 0) / snapshots.length)
        : 0;
      el("snapshotStats").innerHTML = [
        statHtml("快照比赛", `${snapshots.length}`),
        statHtml("有方向推荐", `${directionCount}`),
        statHtml("平均完整度", `${avgCompleteness}%`),
        statHtml("最近快照", latestSnapshot ? shortTime(latestSnapshot.last_fetched_at) : "-"),
        statHtml("最新开赛", latestMatch ? `${latestMatch.home} vs ${latestMatch.away}` : "-")
      ].join("");
      el("matchCount").textContent = `${snapshots.length} 场`;
    }

    function isFinishedSnapshot(item) {
      return item?.is_finished === true || item?.match_status === "finished" || Boolean(item?.validation?.scoreline);
    }

    function filteredSnapshots() {
      const q = el("searchInput").value.trim().toLowerCase();
      let rows = [...(state.data?.snapshots || [])].sort((a, b) => {
        const byTime = timeValue(b.match_time) - timeValue(a.match_time);
        if (byTime) return byTime;
        return Number(b.event_id || 0) - Number(a.event_id || 0);
      });
      if (state.snapshotStatusFilter !== "all") {
        rows = rows.filter((item) =>
          state.snapshotStatusFilter === "finished" ? isFinishedSnapshot(item) : !isFinishedSnapshot(item)
        );
      }
      if (!q) return rows;
      return rows.filter((item) => {
        const haystack = `${item.event_id} ${item.home} ${item.away} ${item.league_name}`.toLowerCase();
        return haystack.includes(q);
      });
    }

    function renderMatchList() {
      const rows = filteredSnapshots();
      const total = state.data?.snapshots?.length || 0;
      el("matchCount").textContent = rows.length === total ? `${total} 场` : `${rows.length}/${total} 场`;
      if (!rows.length) {
        el("matchList").innerHTML = `<div class="empty">没有匹配的快照比赛</div>`;
        return;
      }
      if (!rows.some((item) => item.event_id === state.selectedId)) {
        state.selectedId = rows[0].event_id;
      }
      el("matchList").innerHTML = rows.map((item) => {
        const result = item.last_result;
        const active = item.event_id === state.selectedId ? "active" : "";
        const sideClass = classForSide(result.purchase_side);
        const validate = item.validation
          ? `<span class="badge ${classForOutcome(item.validation.outcome)}">${outcomeText(item.validation.outcome)} ${escapeHtml(item.validation.scoreline)}</span>`
          : "";
        return `
          <button class="match-row ${active}" type="button" data-event-id="${item.event_id}">
            <span>
              <span class="match-name">${escapeHtml(item.home)} vs ${escapeHtml(item.away)}</span>
              <span class="match-sub">
                <span>${item.event_id}</span>
                <span>${escapeHtml(item.asian_line || "0")}</span>
                <span>${shortTime(item.last_fetched_at)}</span>
                <span>${item.snapshot_count} 条</span>
                ${validate}
              </span>
            </span>
            <span class="score-pill ${sideClass}">${escapeHtml(recommendationTag(result))} ${fmt(result.score, 2)}</span>
          </button>
        `;
      }).join("");
      document.querySelectorAll(".match-row").forEach((node) => {
        node.addEventListener("click", () => {
          state.selectedId = Number(node.dataset.eventId);
          renderMatchList();
          renderDetail();
        });
      });
    }

    function renderDetail() {
      const item = selectedEvent();
      if (!item) {
        el("detailBody").innerHTML = `<div class="empty">暂无快照</div>`;
        return;
      }
      const result = item.last_result;
      const sideClass = classForSide(result.purchase_side);
      const scoreNote = result.snapshot_median_count
        ? `中位数 ${result.snapshot_median_count}/${result.snapshot_median_total_count || result.snapshot_median_count} 条；末条 ${fmt(result.last_replay_score, 3)}`
        : `变化 ${fmt(item.score_delta, 3)}`;
      const validation = item.validation
        ? `<span class="badge ${classForOutcome(item.validation.outcome)}">${outcomeText(item.validation.outcome)} ${escapeHtml(item.validation.scoreline)}</span>`
        : `<span class="badge soft">未录入比分</span>`;
      el("detailBody").innerHTML = `
        <div class="detail-title">
          <div>
            <h2 class="match-heading">${escapeHtml(item.home)} vs ${escapeHtml(item.away)}</h2>
            <div class="meta-line">${item.event_id} · ${escapeHtml(item.league_name || "-")} · 开赛 ${shortTime(item.match_time)}</div>
          </div>
          <div>${validation}</div>
        </div>

        <div class="detail-grid">
          ${statHtml("最新推荐", recommendationText(result))}
          ${statHtml("重放 score", fmt(result.score, 3), scoreNote)}
          ${statHtml("置信 / 完整度", `${result.confidence}% / ${result.completeness}%`)}
          ${statHtml("盘口", `${item.asian_line || "0"}`, `深度变化 ${fmt(item.line_depth_delta, 2)}`)}
        </div>

        <div class="metric-tabs" id="metricTabs"></div>
        <div class="chart-box" id="chartBox"></div>

        <div class="notice">${escapeHtml(item.trend_note)}；基础信号历史 ${fmt(item.signal_history_score, 3)}。${escapeHtml(renderReplayNote(item))}</div>

        <div class="split">
          <div>
            <div class="panel-title" style="margin-bottom: 8px;">快照记录</div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>时间</th>
                    <th>推荐</th>
                    <th>重放 score</th>
                    <th>热度</th>
                    <th>成交</th>
                    <th>盈亏</th>
                    <th>上水</th>
                    <th>深度</th>
                  </tr>
                </thead>
                <tbody>
                  ${item.series.map((point) => `
                    <tr>
                      <td>${shortTime(point.fetched_at)}</td>
                      <td>${escapeHtml(recommendationText(point))}</td>
                      <td class="${Number(point.score) >= 0 ? "positive" : "negative"}">${fmt(point.score, 3)}</td>
                      <td>${fmt(point.heat_edge, 3)}</td>
                      <td>${fmt(point.amount_edge, 3)}</td>
                      <td>${fmt(point.payout_edge, 3)}</td>
                      <td>${fmt(point.upper_water, 3)}</td>
                      <td>${fmt(point.line_depth, 2)}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>
          <div>
            <div class="panel-title" style="margin-bottom: 8px;">主要信号</div>
            <div class="signals">
              ${renderSignals(item.important_signals)}
            </div>
          </div>
        </div>

        <div class="predict-box">
          <div class="predict-actions">
            <button class="btn primary" id="predictBtn" type="button">预测最新</button>
            <label class="check"><input id="autoSave" type="checkbox"> 预测后自动存入快照</label>
          </div>
          <div class="predict-result" id="predictResult"></div>
        </div>
      `;
      renderMetricTabs();
      renderChart(item);
      el("predictBtn").addEventListener("click", () => runPredict());
      const cached = state.predictionById.get(item.event_id);
      if (cached) renderPredictionResult(cached);
    }

    function renderSignals(signals) {
      if (!signals || !signals.length) return `<div class="empty">暂无可用信号</div>`;
      return signals.map((signal) => `
        <div class="signal">
          <div class="signal-main">
            <span>${escapeHtml(signal.name)}</span>
            <span class="${Number(signal.score) >= 0 ? "positive" : "negative"}">${fmt(signal.score, 3)}</span>
          </div>
          <div class="signal-summary">${escapeHtml(signal.summary || "")}</div>
        </div>
      `).join("");
    }

    function renderMetricTabs() {
      el("metricTabs").innerHTML = metrics.map(([key, label]) => `
        <button class="metric-tab ${state.metric === key ? "active" : ""}" type="button" data-metric="${key}">
          ${escapeHtml(label)}
        </button>
      `).join("");
      document.querySelectorAll("#metricTabs .metric-tab").forEach((node) => {
        node.addEventListener("click", () => {
          state.metric = node.dataset.metric;
          renderMetricTabs();
          renderChart(selectedEvent());
        });
      });
    }

    function renderChart(item) {
      const points = item.series || [];
      const key = state.metric;
      if (!points.length) {
        el("chartBox").innerHTML = `<div class="empty">暂无趋势点</div>`;
        return;
      }
      const width = 760;
      const height = 260;
      const pad = { left: 42, right: 18, top: 22, bottom: 34 };
      const values = points.map((p) => Number(p[key] || 0));
      let min = Math.min(...values);
      let max = Math.max(...values);
      if (min === max) {
        min -= 0.05;
        max += 0.05;
      }
      const span = max - min || 1;
      min -= span * 0.14;
      max += span * 0.14;
      const xFor = (i) => {
        if (points.length === 1) return (width - pad.left - pad.right) / 2 + pad.left;
        return pad.left + i * ((width - pad.left - pad.right) / (points.length - 1));
      };
      const yFor = (v) => pad.top + (max - v) * ((height - pad.top - pad.bottom) / (max - min));
      const line = points.map((p, i) => `${xFor(i).toFixed(1)},${yFor(Number(p[key] || 0)).toFixed(1)}`).join(" ");
      const zeroY = yFor(0);
      const circles = points.map((p, i) => {
        const value = Number(p[key] || 0);
        return `<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(value).toFixed(1)}" r="4" fill="#2663eb">
          <title>${shortTime(p.fetched_at)} · ${fmt(value, 3)}</title>
        </circle>`;
      }).join("");
      el("chartBox").innerHTML = `
        <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="trend chart">
          <rect width="${width}" height="${height}" fill="#fcfdff"></rect>
          <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${height - pad.bottom}" stroke="#d8dee8"></line>
          <line x1="${pad.left}" y1="${height - pad.bottom}" x2="${width - pad.right}" y2="${height - pad.bottom}" stroke="#d8dee8"></line>
          ${zeroY > pad.top && zeroY < height - pad.bottom ? `<line x1="${pad.left}" y1="${zeroY.toFixed(1)}" x2="${width - pad.right}" y2="${zeroY.toFixed(1)}" stroke="#b7c0cf" stroke-dasharray="4 5"></line>` : ""}
          <text x="8" y="${pad.top + 4}" fill="#667085" font-size="12">${fmt(max, 2)}</text>
          <text x="8" y="${height - pad.bottom + 4}" fill="#667085" font-size="12">${fmt(min, 2)}</text>
          <polyline points="${line}" fill="none" stroke="#2663eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></polyline>
          ${circles}
          <text x="${pad.left}" y="${height - 10}" fill="#667085" font-size="12">${shortTime(points[0].fetched_at)}</text>
          <text x="${width - pad.right - 88}" y="${height - 10}" fill="#667085" font-size="12">${shortTime(points[points.length - 1].fetched_at)}</text>
        </svg>
      `;
    }

    async function runPredict() {
      const item = selectedEvent();
      if (!item || state.loadingPredict) return;
      state.loadingPredict = true;
      const btn = el("predictBtn");
      const autoSave = el("autoSave").checked;
      btn.disabled = true;
      btn.textContent = "预测中";
      el("predictResult").classList.add("visible");
      el("predictResult").innerHTML = `<div class="notice">正在抓取澳客当前数据</div>`;
      try {
        const res = await fetch("/api/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ match_id: item.event_id, save_snapshot: autoSave })
        });
        const payload = await res.json();
        if (!payload.ok) throw new Error(payload.error || "predict failed");
        state.predictionById.set(item.event_id, payload.data);
        renderPredictionResult(payload.data);
        if (payload.data.saved) {
          await loadDashboard(true);
        }
      } catch (err) {
        el("predictResult").innerHTML = `<div class="negative">预测失败：${escapeHtml(err.message)}</div>`;
      } finally {
        state.loadingPredict = false;
        btn.disabled = false;
        btn.textContent = "预测最新";
      }
    }

    function renderPredictionResult(data) {
      const result = data.result;
      const sideClass = classForSide(result.purchase_side);
      const saveButton = data.save_token
        ? `<button class="btn primary" id="savePredictionBtn" type="button">存入快照</button>`
        : "";
      el("predictResult").classList.add("visible");
      el("predictResult").innerHTML = `
        <div class="detail-grid">
          ${statHtml("最新预测", recommendationText(result))}
          ${statHtml("最新预测 score", fmt(result.score, 3), result.strength)}
          ${statHtml("置信 / 完整度", `${result.confidence}% / ${result.completeness}%`)}
          ${statHtml("状态", data.saved ? "已存入快照" : "未存入快照")}
        </div>
        <span class="badge ${sideClass}">${escapeHtml(recommendationTag(result))}</span>
        <span class="notice">${escapeHtml(result.decision_reason || "")}</span>
        <div class="signals" style="margin-top: 10px;">${renderSignals(result.signals)}</div>
        <div class="predict-actions" style="margin-top: 12px;">${saveButton}</div>
      `;
      const saveBtn = el("savePredictionBtn");
      if (saveBtn) {
        saveBtn.addEventListener("click", () => savePrediction(data.save_token));
      }
    }

    async function savePrediction(token) {
      const btn = el("savePredictionBtn");
      if (btn) btn.disabled = true;
      try {
        const res = await fetch("/api/save-prediction", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token })
        });
        const payload = await res.json();
        if (!payload.ok) throw new Error(payload.error || "save failed");
        const item = selectedEvent();
        if (item) state.predictionById.set(item.event_id, payload.data);
        renderPredictionResult(payload.data);
        await loadDashboard(true);
      } catch (err) {
        el("predictResult").insertAdjacentHTML("beforeend", `<div class="negative">保存失败：${escapeHtml(err.message)}</div>`);
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    function renderValidateStats() {
      const validation = state.data?.validation;
      const stats = validation?.stats || {};
      el("validateStats").innerHTML = [
        statHtml("有效下注", `${stats.roi_bets || 0}`),
        statHtml("全赢 / 半赢", `${stats.full_win || 0} / ${stats.half_win || 0}`),
        statHtml("半输 / 全输", `${stats.half_loss || 0} / ${stats.full_loss || 0}`),
        statHtml("净收益", stats.roi_bets ? `${fmt(stats.net_profit, 3)}u` : "-"),
        statHtml("ROI", stats.roi === null || stats.roi === undefined ? "-" : pct(stats.roi)),
        statHtml("排除 / 不足", `${stats.excluded || 0} / ${stats.missing || 0}`)
      ].join("");
      el("validateCount").textContent = `${stats.total || 0} 条`;
      el("scoresPath").textContent = validation?.scores_json || "";
    }

    function renderValidateRows() {
      const rows = state.data?.validation?.records || [];
      const filtered = rows.filter((row) => {
        if (state.validateFilter === "all") return true;
        if (state.validateFilter === "missing") {
          return row.outcome === "missing" || row.outcome === "excluded" || row.status === "insufficient_snapshots";
        }
        if (state.validateFilter === "hit") return row.outcome === "full_win" || row.outcome === "half_win";
        if (state.validateFilter === "miss") return row.outcome === "full_loss" || row.outcome === "half_loss";
        return row.outcome === state.validateFilter;
      });
      el("validateRows").innerHTML = filtered.map((row) => `
        <tr>
          <td>${escapeHtml(row.event_id)}</td>
          <td>${row.snapshot_median_count
            ? `T-${Math.round(Number(row.first_minutes_before || 0))} / T-${Math.round(Number(row.latest_minutes_before || 0))}`
            : "-"}</td>
          <td>${escapeHtml(row.match || "")}</td>
          <td>${escapeHtml(row.asian_line || "")}${row.decimal_odds ? ` @ ${fmt(row.decimal_odds, 2)}` : ""}</td>
          <td>${escapeHtml(row.recommendation || "")}${row.purchase_team ? ` · ${escapeHtml(row.purchase_team)}` : ""}</td>
          <td>${escapeHtml(row.model_recommendation || "")}</td>
          <td class="${Number(row.score || 0) >= 0 ? "positive" : "negative"}">${row.score === undefined ? "-" : fmt(row.score, 3)}</td>
          <td>${escapeHtml(row.scoreline || "")}</td>
          <td><span class="badge ${classForOutcome(row.outcome)}">${outcomeText(row.outcome)}</span></td>
          <td>${row.profit === undefined || row.profit === null ? "-" : `${fmt(row.profit, 3)}u`}</td>
          <td>${shortTime(row.last_fetched_at)}</td>
        </tr>
      `).join("") || `<tr><td colspan="11"><div class="empty">没有匹配记录</div></td></tr>`;
    }

    function bindStaticEvents() {
      el("reloadBtn").addEventListener("click", () => loadDashboard(true));
      el("searchInput").addEventListener("input", () => {
        renderMatchList();
        renderDetail();
      });
      document.querySelectorAll("[data-status-filter]").forEach((node) => {
        node.addEventListener("click", () => {
          state.snapshotStatusFilter = node.dataset.statusFilter;
          document.querySelectorAll("[data-status-filter]").forEach((btn) => btn.classList.toggle("active", btn === node));
          renderMatchList();
          renderDetail();
        });
      });
      document.querySelectorAll(".tab").forEach((node) => {
        node.addEventListener("click", () => {
          state.tab = node.dataset.tab;
          document.querySelectorAll(".tab").forEach((tab) => tab.classList.toggle("active", tab === node));
          el("trendView").classList.toggle("hidden", state.tab !== "trend");
          el("validateView").classList.toggle("hidden", state.tab !== "validate");
        });
      });
      document.querySelectorAll("[data-filter]").forEach((node) => {
        node.addEventListener("click", () => {
          state.validateFilter = node.dataset.filter;
          document.querySelectorAll("[data-filter]").forEach((btn) => btn.classList.toggle("active", btn === node));
          renderValidateRows();
        });
      });
    }

    bindStaticEvents();
    loadDashboard();
  </script>
</body>
</html>
